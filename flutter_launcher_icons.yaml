# App icon config for flutter_launcher_icons.
# After changing anything here, run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  # Android 8+: navy background + orange logo, shaped by the phone's launcher
  adaptive_icon_background: "#1F202B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ "Themed icons": the logo recolored to match your wallpaper
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1F202B"
    theme_color: "#F4B272"
